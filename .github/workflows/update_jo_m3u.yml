name: Build jo.m3u

# Trigger from cron-job.org via workflow_dispatch (GitHub cron is unreliable).
# POST https://api.github.com/repos/<owner>/iptvjson/actions/workflows/update_jo_m3u.yml/dispatches
# Body: {"ref":"main"}
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the cookie has not changed
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-jo-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if cookie changed
        id: cookie
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force || 'false' }}
        run: python3 .github/scripts/check_cookie.py

      - name: Build jo.m3u
        if: steps.cookie.outputs.changed == 'true'
        run: python3 .github/scripts/build_jo_m3u.py

      - name: Commit & push if changed
        if: steps.cookie.outputs.changed == 'true'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jo.m3u .github/state/cookie.stamp
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh jo.m3u (token rotation)"
          git push origin HEAD:main
