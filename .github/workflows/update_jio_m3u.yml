name: Build jio.m3u

on:
  schedule:
    # Refresh at 01:15, 07:15, 13:15, and 19:15 IST.
    # GitHub Actions cron uses UTC: 01:45, 07:45, 13:45, 19:45 UTC.
    - cron: "45 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jio-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build jio.m3u
        run: python3 .github/scripts/build_jio_m3u.py

      - name: Commit & push if changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jio.m3u
          if git diff --cached --quiet; then
            echo "No changes to jio.m3u."
            exit 0
          fi
          git commit -m "chore: refresh jio.m3u (token rotation)"
          git push origin HEAD:main
